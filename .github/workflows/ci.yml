name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — typecheck, lint, test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://root:root@localhost:3306/tsgecart_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci_access_secret_value_123456
      JWT_REFRESH_SECRET: ci_refresh_secret_value_123456
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run prisma:generate --workspace backend
      - run: npm run typecheck --workspace backend
      - run: npm run lint --workspace backend
      - run: npm test --workspace backend

  frontend:
    name: Frontend — typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint --workspace frontend
      - run: npm run build --workspace frontend
